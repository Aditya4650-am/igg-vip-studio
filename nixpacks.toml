[phases.setup]
nixPkgs = ["python311", "nodejs_22"]

# Kept as a hedge for Nixpacks-based builders. Render's native Node runtime
# does not read this file (Render uses Cloud Native Buildpacks, not Nixpacks),
# but python3 already ships in Render's runtime image, so FetchCity's
# `spawn("python3", …)` works there without it.
[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

