services:
  - type: web
    name: igg-vip-studio
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # Best-effort install of `cryptography` for scripts/township/fetch_city.py.
    # The FetchCity response is decrypted with Playrix's AES-CTR and the
    # hand-rolled port in ts_township_core.py costs ~22 us per byte - 17 s for a
    # 750 KB city, which is what pushed large cities past the child timeout while
    # small ones still succeeded. `cryptography` produces the same keystream in
    # ~1 ms, verified byte-for-byte against the port. The script always exits 0
    # and the `|| true` is belt and braces: if it cannot install, fetch_city.py
    # keeps using the port and the raised deadline still lets the download
    # finish. Its attempts are echoed because the build log is the only place
    # the outcome can be seen.
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && (python3 scripts/township/setup_fast_aes.py || true) && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GROK_PROJECT_ID
        value: igg-vip-studio
      # FetchCity spawns scripts/township/fetch_city.py. Render's native Node
      # runtime ships python3, and pinning the binary here skips the
      # python3 -> python fallback probe on every call.
      - key: PYTHON_BIN
        value: python3
      - key: IGG_VIP_MASTER
        sync: false
      - key: IGG_VIP_OWNER
        sync: false
