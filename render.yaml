services:
  - type: web
    name: igg-vip-studio
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # The pip step is best-effort on purpose (note the `|| true`): it only tries
    # to make `cryptography` available to scripts/township/fetch_city.py, which
    # decrypts the FetchCity response with Playrix's AES-CTR. The hand-rolled
    # port in ts_township_core.py is correct but costs ~22 us per byte, so a
    # large city took long enough to hit the child timeout while a small one did
    # not. If pip or the wheel is unavailable, the port is used and the download
    # is simply slower - it must never break the build. `--only-binary` keeps it
    # from trying to compile (cryptography needs Rust), failing fast instead.
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && (python3 -m pip install --only-binary=:all: --break-system-packages -r requirements.txt || python3 -m pip install --only-binary=:all: --user -r requirements.txt || true) && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GROK_PROJECT_ID
        value: igg-vip-studio
      # FetchCity spawns scripts/township/fetch_city.py. Render's native Node
      # runtime ships python3, and pinning the binary here skips the
      # python3 -> python fallback probe on every call.
      - key: PYTHON_BIN
        value: python3
      - key: IGG_VIP_MASTER
        sync: false
      - key: IGG_VIP_OWNER
        sync: false
