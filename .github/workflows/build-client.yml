name: Build Windows client

# The client is a Windows EXE built with PyInstaller, which cannot cross-compile
# from Linux and needs the Windows WebView2 stack. GitHub's windows runner is
# the only place this can be produced.
on:
  # Tags are the release path; manual dispatch covers ad-hoc builds. Deliberately
  # no paths filter: when both a tag filter and a paths filter are present,
  # GitHub only runs the workflow if both match, and a tag push carries no file
  # changes, so tagged builds would silently never fire.
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # PyInstaller needs a bootloader built for this exact interpreter; the
          # newest stable Python can ship before that bootloader exists, which is
          # what forced the old console=True workaround. 3.12 is a safe floor.
          python-version: "3.12"

      - name: Install build tools
        working-directory: client
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Test the client's URL handling
        working-directory: client
        run: python -m unittest discover -p "test_*.py" -v

      - name: Build EXE
        working-directory: client
        run: python -m PyInstaller --clean --noconfirm igg_client.spec

      - name: Verify the EXE is a windowed build
        shell: pwsh
        working-directory: client
        run: |
          # A console-subsystem EXE is what produces the stray cmd window, so
          # fail the build rather than ship one. The build is onedir: the EXE
          # lives inside the app folder next to its _internal\ dependencies.
          $exe = "dist/IGG VIP TOOL/IGG VIP TOOL.exe"
          if (-not (Test-Path $exe)) { throw "EXE was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          Write-Host "PE subsystem = $subsystem (2=GUI/windowed, 3=console)"
          if ($subsystem -ne 2) { throw "Expected a windowed (GUI) executable, got subsystem $subsystem" }

      - name: Sign the EXE (only when a code-signing cert is configured)
        shell: pwsh
        working-directory: client
        env:
          # Set these three repo secrets once an OV/EV code-signing certificate
          # is bought; until then the step exits 0 and changes nothing. Signing
          # is what removes the SmartScreen "Windows protected your PC" dialog
          # and builds reputation with Defender - no obfuscation can do that.
          # SIGN_CERT_BASE64: base64 of the .pfx file
          # SIGN_CERT_PASSWORD: the .pfx password
          # SIGN_TIMESTAMP_URL: e.g. http://timestamp.digicert.com
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ secrets.SIGN_TIMESTAMP_URL }}
        run: |
          if (-not $env:SIGN_CERT_BASE64) {
            Write-Host "No signing cert configured - skipping (expected until a cert is bought)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on the runner" }
          $ts = if ($env:SIGN_TIMESTAMP_URL) { $env:SIGN_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          & $signtool.FullName sign /f $pfx /p $env:SIGN_CERT_PASSWORD /tr $ts /td sha256 /fd sha256 "dist/IGG VIP TOOL/IGG VIP TOOL.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx -Force
          Write-Host "Signed dist/IGG VIP TOOL/IGG VIP TOOL.exe"

      - name: Package the app folder as the release zip
        shell: pwsh
        working-directory: client
        run: |
          # The release ships the whole onedir folder as one zip (clients
          # extract it and run "IGG VIP TOOL\IGG VIP TOOL.exe"). The client's
          # auto-update verifies the SHA-256 of this exact archive.
          Compress-Archive -Path "dist/IGG VIP TOOL" -DestinationPath "dist/IGG.VIP.TOOL.zip" -Force

      - name: Hash the release zip
        id: hash
        shell: pwsh
        working-directory: client
        run: |
          $h = (Get-FileHash "dist/IGG.VIP.TOOL.zip" -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@v4
        with:
          name: IGG-VIP-TOOL-client
          path: client/dist/IGG.VIP.TOOL.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/dist/IGG.VIP.TOOL.zip
          body: |
            SHA-256 of the zip: `${{ steps.hash.outputs.sha256 }}`

            Extract the zip and run `IGG VIP TOOL\IGG VIP TOOL.exe`.

            Paste the hash above into the server's `CLIENT_UPDATE_SHA256` env
            var, and the zip's download URL into `CLIENT_UPDATE_URL`, to enable
            auto-update.