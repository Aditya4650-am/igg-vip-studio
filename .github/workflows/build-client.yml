name: Build Windows client

# The client is a Windows EXE built with Nuitka (machine code) and then
# encrypted by protect/build.py, which cannot cross-compile from Linux and
# needs the Windows WebView2 stack. GitHub's windows runner is the only place
# this can be produced.
on:
  # Tags are the release path; manual dispatch covers ad-hoc builds. Deliberately
  # no paths filter: when both a tag filter and a paths filter are present,
  # GitHub only runs the workflow if both match, and a tag push carries no file
  # changes, so tagged builds would silently never fire.
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 is the floor Nuitka's MinGW toolchain supports; 3.13+ would
          # force MSVC. The loader is compiled with the same MinGW gcc Nuitka
          # downloads, so one toolchain builds both halves.
          python-version: "3.12"

      # Nuitka downloads a MinGW-w64 gcc into this directory on first use.
      # Caching it keeps the build to compile time only.
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Nuitka
          key: nuitka-mingw-${{ runner.os }}-py312

      - name: Install build tools
        working-directory: client
        run: python -m pip install --upgrade pip nuitka pywebview cryptography

      - name: Test the client's URL handling and the protector
        working-directory: client
        run: python -m unittest discover -p "test_*.py" -v

      - name: Build protected EXE
        working-directory: client
        run: python protect/build.py

      # protect/build.py already launches the EXE with IGG_CLIENT_PROBE and
      # fails if it cannot find its bundled adb / fresh_profile; this repeats
      # the launch as an explicit gate so a regression is named in the log.
      - name: Prove the encrypted EXE still runs
        shell: pwsh
        working-directory: client
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "igg-probe.json"
          $env:IGG_CLIENT_PROBE = $probe
          $p = Start-Process -FilePath "dist/IGG VIP TOOL.exe" -PassThru -Wait
          if (-not (Test-Path $probe)) { throw "self-test produced no report (exit $($p.ExitCode))" }
          $r = Get-Content $probe -Raw | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 5 | Write-Host
          if (-not $r.adb) { throw "bundled adb not reachable" }
          if (-not $r.fresh_profile) { throw "bundled fresh_profile not reachable" }
          if (-not $r.compiled) { throw "payload is not compiled - bytecode would be extractable" }

      - name: Verify the EXE is a windowed build
        shell: pwsh
        working-directory: client
        run: |
          # A console-subsystem EXE is what produces the stray cmd window, so
          # fail the build rather than ship one. This now checks the *packed*
          # file: the loader is compiled with -mwindows, so a console loader
          # (or an accidentally unwindowed payload) fails here too.
          $exe = "dist/IGG VIP TOOL.exe"
          if (-not (Test-Path $exe)) { throw "EXE was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          Write-Host "PE subsystem = $subsystem (2=GUI/windowed, 3=console)"
          if ($subsystem -ne 2) { throw "Expected a windowed (GUI) executable, got subsystem $subsystem" }

      - name: Hash the EXE
        id: hash
        shell: pwsh
        working-directory: client
        run: |
          $h = (Get-FileHash "dist/IGG VIP TOOL.exe" -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@v4
        with:
          name: IGG-VIP-TOOL-exe
          path: client/dist/IGG VIP TOOL.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/dist/IGG VIP TOOL.exe
          body: |
            SHA-256: `${{ steps.hash.outputs.sha256 }}`

            Paste this hash into the server's `CLIENT_UPDATE_SHA256` env var, and
            the download URL into `CLIENT_UPDATE_URL`, to enable auto-update.

            Protected build: Nuitka-compiled, AES-256-GCM encrypted, integrity
            checked and anti-debug guarded at launch.
