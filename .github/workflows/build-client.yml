name: Build Windows client

# The client is a Windows EXE built with PyInstaller, which cannot cross-compile
# from Linux and needs the Windows WebView2 stack. GitHub's windows runner is
# the only place this can be produced.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths: ["client/**", ".github/workflows/build-client.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # PyInstaller needs a bootloader built for this exact interpreter; the
          # newest stable Python can ship before that bootloader exists, which is
          # what forced the old console=True workaround. 3.12 is a safe floor.
          python-version: "3.12"

      - name: Install build tools
        working-directory: client
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Build EXE
        working-directory: client
        run: python -m PyInstaller --clean --noconfirm igg_client.spec

      - name: Verify the EXE is a windowed build
        shell: pwsh
        working-directory: client
        run: |
          # A console-subsystem EXE is what produces the stray cmd window, so
          # fail the build rather than ship one.
          $exe = "dist/IGG-VIP-Studio.exe"
          if (-not (Test-Path $exe)) { throw "EXE was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          Write-Host "PE subsystem = $subsystem (2=GUI/windowed, 3=console)"
          if ($subsystem -ne 2) { throw "Expected a windowed (GUI) executable, got subsystem $subsystem" }

      - name: Hash the EXE
        id: hash
        shell: pwsh
        working-directory: client
        run: |
          $h = (Get-FileHash dist/IGG-VIP-Studio.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@v4
        with:
          name: IGG-VIP-Studio-exe
          path: client/dist/IGG-VIP-Studio.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/dist/IGG-VIP-Studio.exe
          body: |
            SHA-256: `${{ steps.hash.outputs.sha256 }}`

            Paste this hash into the server's `CLIENT_UPDATE_SHA256` env var, and
            the download URL into `CLIENT_UPDATE_URL`, to enable auto-update.